name: clones_desktop
description: "A desktop application for contributing to the world's largest dataset for multimodal computer-use agents."
publish_to: 'none'

version: 0.2.109+109

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:

  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  collection: any
  crypto: any
  decimal: ^3.2.2
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.6.0
  freezed_annotation: ^2.4.4
  go_router: ^13.2.0
  gradient_borders: ^1.0.1
  http: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.8.1
  media_kit: ^1.1.11
  media_kit_libs_macos_video: ^1.0.8
  media_kit_libs_windows_video: ^1.0.10
  media_kit_video: ^1.2.5
  msix: ^3.16.12
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  process: ^5.0.5
  riverpod: any
  riverpod_annotation: ^2.6.1
  screen_retriever: ^0.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  
dev_dependencies:
  build_runner: ^2.4.6
  custom_lint: ^0.7.0
  dependency_validator: ^5.0.2
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

dependency_overrides:
  analyzer_plugin: ^0.13.1


msix_config:
  display_name: Clones AI Desktop
  publisher_display_name: Clones
  publisher: CN=ED6E50CB-2C1F-484F-B7E7-07431405E106
  identity_name: Clones.ClonesAIDesktop
  msix_version: 0.2.99.0
  logo_path: assets/icons-app/icon.png
  start_menu_icon_path: assets/icons-app/icon.png
  tile_icon_path: assets/icons-app/icon.png
  languages: en-us
  capabilities: 'internetClient'
  
  # Store-specific configuration
  store: true
  
  # Architecture support
  architecture: x64
  
  # App description for Store
  description: 'A desktop application for contributing to the world largest dataset for multimodal computer-use agents.'
  
  # Additional metadata
  execution_alias: clones
  protocol_activation: clones

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/menus/
    - assets/icons-app/
    - .env
    - pubspec.yaml
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter/Inter-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/Inter-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter/Inter-BlackItalic.ttf
          weight: 900
          style: italic
